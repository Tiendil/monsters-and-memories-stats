<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
<title id="title">Dashboard Overview layout study</title>
<desc id="description">A warm light desktop dashboard and a narrow-screen arrangement. Compact shared controls precede four headline counts and a full-width population trend. All values and lines are synthetic; this illustration is not an implemented interface or an authoritative design-token source.</desc>
