name: Set up project tools
description: Load the shared Docker development image and prepare locked dependencies.
runs:
  using: composite
  steps:
    - name: Set up Docker build cache
      uses: docker/setup-buildx-action@v4.4.1
    - name: Build development image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: docker/dev/Dockerfile
        platforms: linux/amd64
        load: true
        tags: mnm-stats-dev:local
        cache-from: type=gha,scope=development
        cache-to: type=gha,scope=development,mode=max
    - name: Restore Cargo cache
      uses: actions/cache@v6.1.0
      with:
        path: |
          .cache/docker/cargo
          target/docker
        key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/dev/Dockerfile') }}-${{ hashFiles('mnm-stats/**', 'bin/**') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/dev/Dockerfile') }}-
    - name: Fetch locked dependencies
      shell: bash
      run: ./bin/dev.sh setup --image-ready
