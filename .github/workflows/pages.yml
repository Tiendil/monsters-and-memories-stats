name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Collect metrics]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Serialize the complete build/deploy cycle. Even a delayed older trigger checks
# out the latest branch only after the previous deployment finishes.
# Skipped runs from failed collections must not displace pending deployments.
concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out latest default branch
        id: source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out latest collected history
        id: history
        uses: actions/checkout@v7.0.1
        with:
          ref: data
          path: collected-data
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6.0.0
      - uses: ./.github/actions/setup
      - name: Build dashboard with collected history
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          MNM_STATS_HISTORY: collected-data/data/history.jsonl
          MNM_STATS_BUILD_REVISION: ${{ steps.source.outputs.commit }}
          MNM_STATS_DATA_REVISION: ${{ steps.history.outputs.commit }}
        run: ./bin/build-dashboard.sh --public-url "$PAGES_BASE_PATH/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
