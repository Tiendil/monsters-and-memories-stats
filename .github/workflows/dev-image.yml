name: Publish development image

on:
  push:
    branches: [main]
    paths:
      - docker/dev/Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - .github/actions/image-reference/action.yml
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image-reference
        id: image
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check for an existing image
        id: existing
        env:
          DEV_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if docker manifest inspect "$DEV_IMAGE" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.existing.outputs.found != 'true'
      - name: Build and publish development image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/dev/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,scope=development,mode=max
