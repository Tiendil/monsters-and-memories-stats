name: Collect metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_failure_notification:
        description: Deliberately fail using a local fixture, without collecting or changing history
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-metrics
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    env:
      MNM_STATS_COLLECTOR_BINARY: .cache/collector/mnm-stats-collector
    steps:
      - name: Check out latest default branch
        id: source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out collected history
        if: ${{ !inputs.verify_failure_notification }}
        uses: actions/checkout@v7.0.1
        with:
          ref: data
          path: collected-data
      - name: Restore exact collector executable
        id: collector
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.MNM_STATS_COLLECTOR_BINARY }}
          # The source revision also identifies the image and build configuration.
          key: collector-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-${{ steps.source.outputs.commit }}
      - uses: ./.github/actions/setup
        with:
          cargo: ${{ steps.collector.outputs.cache-hit != 'true' }}
      - name: Prepare collector executable
        if: steps.collector.outputs.cache-hit != 'true'
        env:
          MNM_STATS_BUILD_REVISION: ${{ steps.source.outputs.commit }}
          MNM_STATS_BUILD_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./bin/build-collector.sh
      - name: Save exact collector executable
        if: steps.collector.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.MNM_STATS_COLLECTOR_BINARY }}
          key: ${{ steps.collector.outputs.cache-primary-key }}
      - name: Verify failure notification
        if: inputs.verify_failure_notification
        run: ./bin/verify-collection-failure.sh
      - name: Validate existing archive
        if: ${{ !inputs.verify_failure_notification }}
        run: ./bin/validate-history.sh collected-data/data/history.jsonl
      - name: Collect current state
        if: ${{ !inputs.verify_failure_notification }}
        run: ./bin/collect.sh --history collected-data/data/history.jsonl
      - name: Publish history commit
        if: ${{ !inputs.verify_failure_notification }}
        run: ./bin/publish-history.sh collected-data
      - name: Retain history after failure
        if: ${{ failure() && !inputs.verify_failure_notification }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: collection-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected-data/data/history.jsonl
          retention-days: 30
          if-no-files-found: warn
