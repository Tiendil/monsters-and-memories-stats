name: Collect metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_failure_notification:
        description: Deliberately fail using a local fixture, without collecting or changing history
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-metrics
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup
      - name: Verify failure notification
        if: inputs.verify_failure_notification
        run: ./bin/verify-collection-failure.sh
      - name: Collect current state
        if: ${{ !inputs.verify_failure_notification }}
        run: ./bin/collect.sh --history data/history.jsonl
      - name: Publish history commit
        if: ${{ !inputs.verify_failure_notification }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./bin/publish-history.sh "$DEFAULT_BRANCH"
      - name: Retain history after failure
        if: ${{ failure() && !inputs.verify_failure_notification }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/history.jsonl
          retention-days: 30
          if-no-files-found: warn
