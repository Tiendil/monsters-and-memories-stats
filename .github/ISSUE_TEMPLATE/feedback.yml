name: Feedback
description: Suggest an improvement or report a problem with the dashboard.
body:
  - type: dropdown
    id: feedback-type
    attributes:
      label: Type
      options:
        - Feature suggestion
        - Bug report
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        **Suggestion:** Describe what you would like to change and why.

        **Bug:** Describe what happened, what you expected, and how to reproduce it if possible.

        Links and screenshots are welcome.
    validations:
      required: true
