name: Feature request
description: Suggest an improvement to the Monsters & Memories statistics dashboard.
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature or change
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: How would this help you use the dashboard or understand the game’s activity?
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Add any relevant links, screenshots, or sketches.
    validations:
      required: false
