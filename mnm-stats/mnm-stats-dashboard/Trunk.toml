trunk-version = "=0.21.14"

[build]
target = "index.html"
dist = "../../dist"
public_url = "/"
locked = true

[serve]
addresses = ["127.0.0.1"]

[tools]
wasm_bindgen = "0.2.129"

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-ec", 'cp -- "${MNM_STATS_HISTORY:-../../data/history.jsonl}" "$TRUNK_STAGING_DIR/history.jsonl"']
