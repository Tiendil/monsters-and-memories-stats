[package]
name = "mnm-stats-dashboard"
default-run = "mnm-stats-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mnm-stats-model.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
plotly.workspace = true
form_urlencoded.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos.workspace = true
web-sys = { workspace = true, features = ["History"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[build-dependencies]
mnm-stats-model.workspace = true
serde_json.workspace = true
cssparser.workspace = true
csscolorparser.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest.workspace = true
cssparser.workspace = true
csscolorparser.workspace = true

[[test]]
name = "browser"
required-features = ["browser-tests"]

[features]
browser-tests = []
