version = 1

[[relations]]
id = "governed_by"
description = "Specifications that apply to the artifact."

[[relations]]
id = "governs"
description = "Artifacts governed by the specification."

# General rules govern all specifications, including themselves.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/**/*.md" }
output = { type = "list", artifacts = ["@/specs/meta/general.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/meta/general.md"] }
output = { type = "files", pattern = "@/specs/**/*.md" }

# The working agreement also governs the repository's agent workflow and investigation notes.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "one_of", artifacts = ["@/AGENTS.md", "@/README.md", "@/donna.toml", "@/depmesh.toml", "@/.gitignore", "@/.dockerignore", "@/docker-compose.yml"] },
  { type = "glob", pattern = "@/docs/**" },
  { type = "glob", pattern = "@/docker/**" },
  { type = "glob", pattern = "@/workflows/**" },
  { type = "glob", pattern = "@/bin/**" },
  { type = "glob", pattern = "@/.codex/**" },
  { type = "glob", pattern = "@/.agents/**" },
] }
output = { type = "list", artifacts = ["@/specs/development.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/development.md"] }
output = { type = "union", items = [
  { type = "list", artifacts = ["@/AGENTS.md", "@/README.md", "@/donna.toml", "@/depmesh.toml", "@/.gitignore", "@/.dockerignore", "@/docker-compose.yml"] },
  { type = "files", pattern = "@/docs/**" },
  { type = "files", pattern = "@/docker/**" },
  { type = "files", pattern = "@/workflows/**" },
  { type = "files", pattern = "@/bin/**" },
  { type = "files", pattern = "@/.codex/**" },
  { type = "files", pattern = "@/.agents/**" },
] }

# Runtime contracts apply to all component files and build inputs.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "one_of", artifacts = ["@/Cargo.toml", "@/Cargo.lock", "@/rust-toolchain.toml"] },
  { type = "glob", pattern = "@/mnm-stats/**" },
  { type = "glob", pattern = "@/data/**" },
  { type = "glob", pattern = "@/.github/**" },
] }
output = { type = "list", artifacts = ["@/specs/requirements.md", "@/specs/architecture.md", "@/specs/development.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/requirements.md", "@/specs/architecture.md", "@/specs/development.md"] }
output = { type = "union", items = [
  { type = "list", artifacts = ["@/Cargo.toml", "@/Cargo.lock", "@/rust-toolchain.toml"] },
  { type = "files", pattern = "@/mnm-stats/**" },
  { type = "files", pattern = "@/data/**" },
  { type = "files", pattern = "@/.github/**" },
] }

# Tests, verification commands, and check workflows follow the offline contract.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/mnm-stats/*/tests/**" },
  { type = "glob", pattern = "@/workflows/**/*.donna.md" },
  { type = "glob", pattern = "@/bin/test*.sh" },
  { type = "glob", pattern = "@/bin/check*.sh" },
  { type = "glob", pattern = "@/bin/verify*.sh" },
  { type = "one_of", artifacts = ["@/.github/workflows/code-checks.yml", "@/mnm-stats/mnm-stats-collector/src/acquisition.rs"] },
] }
output = { type = "list", artifacts = ["@/specs/tests.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/tests.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/mnm-stats/*/tests/**" },
  { type = "files", pattern = "@/workflows/**/*.donna.md" },
  { type = "files", pattern = "@/bin/test*.sh" },
  { type = "files", pattern = "@/bin/check*.sh" },
  { type = "files", pattern = "@/bin/verify*.sh" },
  { type = "list", artifacts = ["@/.github/workflows/code-checks.yml", "@/mnm-stats/mnm-stats-collector/src/acquisition.rs"] },
] }

# Project commands follow application contracts, including newly added commands.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/bin/*.sh" }
output = { type = "list", artifacts = ["@/specs/requirements.md", "@/specs/architecture.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/requirements.md", "@/specs/architecture.md"] }
output = { type = "files", pattern = "@/bin/*.sh" }

# Presentation values are shared by CSS, Rust charts, and dashboard packaging.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/mnm-stats/mnm-stats-dashboard/**" },
  { type = "glob", pattern = "@/bin/*dashboard.sh" },
  { type = "one_of", artifacts = ["@/docker/dev/Dockerfile"] },
] }
output = { type = "list", artifacts = ["@/specs/design-tokens.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/design-tokens.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/mnm-stats/mnm-stats-dashboard/**" },
  { type = "files", pattern = "@/bin/*dashboard.sh" },
  { type = "list", artifacts = ["@/docker/dev/Dockerfile"] },
] }

# Dashboard composition and visual behavior.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/mnm-stats/mnm-stats-dashboard/**" }
output = { type = "list", artifacts = ["@/specs/dashboard-design.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/dashboard-design.md"] }
output = { type = "files", pattern = "@/mnm-stats/mnm-stats-dashboard/**" }

# Development environment ownership.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "one_of", artifacts = ["@/docker-compose.yml", "@/.dockerignore"] },
  { type = "glob", pattern = "@/docker/**" },
  { type = "glob", pattern = "@/.codex/**" },
] }
output = { type = "list", artifacts = ["@/specs/architecture.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/architecture.md"] }
output = { type = "union", items = [
  { type = "list", artifacts = ["@/docker-compose.yml", "@/.dockerignore"] },
  { type = "files", pattern = "@/docker/**" },
  { type = "files", pattern = "@/.codex/**" },
] }
